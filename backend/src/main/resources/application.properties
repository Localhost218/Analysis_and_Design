spring.application.name=f1-sponsorship
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/f1}
spring.datasource.username=${DB_USER:f1}
spring.datasource.password=${DB_PASSWORD:f1}

# schema.sql + data.sql chạy mỗi lần khởi động (idempotent), trước khi Hibernate validate
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false

spring.jackson.time-zone=Asia/Ho_Chi_Minh
