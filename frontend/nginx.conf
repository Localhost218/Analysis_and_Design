server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API -> backend (service "backend" trong docker-compose)
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA: mọi route của React Router trả về index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
